<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deduplicator</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Find Duplicate Images</h1>
  <button class="btn btn-secondary btn-bin" id="btn-open-bin" style="display:none">🗑 Recycle Bin</button>
</header>

<!-- VIEW 1: Setup -->
<div id="view-setup" class="view active">
  <div class="form-group">
    <div class="section-title">Select folders to scan</div>
    <div class="folder-tree" id="folder-tree">
      <div style="color:#64748b;font-size:0.85rem;padding:0.5rem">Loading…</div>
    </div>
  </div>

  <div class="form-group">
    <label>Ignore patterns (regex, one per line)</label>
    <textarea id="ignore-patterns" placeholder="\.thumb\.\nThumbnails/\n_preview_">@eaDir</textarea>
  </div>

  <div class="form-group">
    <label>Similarity threshold — Hamming distance (0 = exact only, 20 = very similar)</label>
    <div class="threshold-row">
      <input type="range" id="threshold" min="0" max="20" value="10">
      <span class="val" id="threshold-val">10</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-scan" disabled>Start scan</button>
</div>

<!-- VIEW 2: Progress -->
<div id="view-progress" class="view">
  <div class="progress-wrap">
    <h2 id="progress-title">Scanning…</h2>
    <div class="phase-label" id="phase-label">Preparing…</div>
    <progress id="progress-bar" value="0" max="100"></progress>
    <div class="counter" id="counter"></div>
    <button class="btn btn-secondary" id="btn-abort" style="margin-top:1.5rem">Cancel scan</button>
  </div>
</div>

<!-- VIEW 3: Results -->
<div id="view-results" class="view">
  <div class="results-header">
    <div>
      <h2>Duplicate groups</h2>
      <div class="stats" id="stats"></div>
    </div>
    <button class="btn btn-secondary" id="btn-new-scan">New scan</button>
  </div>

  <div id="action-bar" class="action-bar">
    <span id="sel-count"></span>
    <div class="action-bar-right">
      <select id="action-select">
        <option value="">Select action…</option>
        <option value="accept">Accept</option>
        <option value="trash" id="opt-trash" style="display:none">Move to Recycle Bin</option>
      </select>
      <button class="btn btn-primary" id="btn-apply">Apply</button>
      <button class="btn btn-secondary" id="btn-clear-sel">Clear selection</button>
    </div>
  </div>

  <div class="filter-row">
    <input type="search" id="filter-input" placeholder="Filter by filename…">
  </div>

  <table id="results-table">
    <thead>
      <tr>
        <th data-col="name">Filename <span class="sort-icon">↕</span></th>
        <th data-col="count">Files <span class="sort-icon">↕</span></th>
        <th data-col="size">Total size <span class="sort-icon">↕</span></th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
  <div id="no-results" class="no-results" style="display:none">No duplicate groups found.</div>
</div>

<!-- VIEW 4: Recycle Bin -->
<div id="view-bin" class="view">
  <div class="results-header">
    <div>
      <h2>Recycle Bin</h2>
      <div class="stats" id="bin-stats"></div>
    </div>
    <button class="btn btn-secondary" id="btn-back-from-bin">← Back</button>
  </div>

  <div id="bin-action-bar" class="action-bar">
    <span id="bin-sel-count">No items selected</span>
    <div class="action-bar-right">
      <button class="btn btn-primary" id="btn-restore" disabled>Restore selected</button>
      <button class="btn btn-secondary" id="btn-bin-clear-sel">Clear selection</button>
    </div>
  </div>

  <div id="bin-grid" class="bin-grid"></div>
  <div id="bin-empty" class="no-results" style="display:none">Recycle Bin is empty.</div>
  <div id="bin-loading" class="no-results">Loading…</div>
</div>

<!-- Confirmation modal -->
<div class="modal-backdrop" id="confirm-modal">
  <div class="confirm-box">
    <h3 id="confirm-title"></h3>
    <p id="confirm-desc"></p>
    <ul id="confirm-list" class="confirm-list"></ul>
    <div class="confirm-buttons">
      <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-ok">Confirm</button>
    </div>
  </div>
</div>

<!-- Image modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal-content">
    <button class="modal-close" id="modal-close">&times;</button>
    <div class="modal-body">
      <div class="modal-img-wrap">
        <img id="modal-img" src="" alt="">
      </div>
      <div class="modal-info" id="modal-info"></div>
    </div>
  </div>
</div>

<footer>
  <span class="footer-name">Deduplicator</span>
  <span class="badge" id="version-badge">…</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
