services:
  deduplicator:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - /path/to/your/photos:/mnt:rw   # set to your photo library
      - /path/to/data:/data             # persistent state (accepted list, bin records)
    environment:
      MOUNT_ROOT: /mnt
      PORT: "8080"
      DATA_DIR: /data
      # RECYCLE_BIN: /mnt/Trash         # optional: enable soft-delete to this path
    restart: unless-stopped
